name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AudioPuente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk AudioPuente.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AudioPuente-apk
          path: AudioPuente/AudioPuente.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión
          files: AudioPuente/AudioPuente.apk
          make_latest: true
